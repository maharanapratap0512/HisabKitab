<div class="wrapper">
   <div class="content-page">
      <div class="content">
         <div class="registration-bg">

            <div class="account-pages pt-2 pt-sm-5 pb-4 pb-sm-5">
               <div class="container">
                  <div class="row justify-content-center">
                     <div class="col-xxl-4 col-lg-5">
                        <div class="card">

                           <!-- Logo -->
                           <div class="card-header pt-4 pb-4 text-center bg-primary">
                              <a>
                                 <span>AIVV</span>
                              </a>
                           </div>

                           <div class="card-body p-4">

                              <div class="text-center w-75 m-auto">
                                 <h4 class="text-dark-50 text-center pb-0 fw-bold">Register A New User</h4>
                                 <p class="text-muted mb-4">Enter Role,Userid and Password to access software.
                                 </p>
                              </div>

                              <form [formGroup]="loginForm">
                                 <div class=" mb-5">
                                    <label for="emailaddress" class="form-label">User Role</label>
                                    <select class="form-control mm" style="width: 100%;" formControlName="role"  placeholder="Enter your role">
                                       <option selected="selected" disabled value="">Select Role</option>
                                       <option value="rajkot">Rajkot</option>
                                       <option value="surat">Surat</option>
                                       <option value="delhi">Delhi</option>
                                       <option value="kampil">Kampil</option>
                                       <option value="aagra">Aagra</option>
                                       <option value="mount abu">Mount Abu</option>
                                    </select>
                                 </div>

                                 <div class="mb-3">
                                    <label for="emailaddress" class="form-label">Email address</label>
                                    <input class="form-control" type="email" id="emailaddress" required=""
                                       placeholder="Enter your email" formControlName="email">
                                 </div>

                                 <div class="mb-3">
                                    <a class="text-muted float-end">
                                       <small>Forgot your password?</small>
                                    </a>
                                    <label for="password" class="form-label">Password</label>
                                    <div class="input-group input-group-merge">
                                       <input type="password" id="password" class="form-control"
                                          placeholder="Enter your password" formControlName="password">
                                       <div class="input-group-text" data-password="false">
                                          <span class="password-eye"></span>
                                       </div>
                                    </div>
                                 </div>

                                 <!-- <div class="mb-3 mb-3">
                           <div class="form-check">
                              <input type="checkbox" class="form-check-input" id="checkbox-signin" checked>
                              <label class="form-check-label" for="checkbox-signin">Remember me</label>
                           </div>
                        </div> -->

                                 <div class="mb-3 mb-0 text-center">
                                    <button class="btn btn-primary" type="submit" (click)="loginSubmit()"> Log In
                                    </button>
                                 </div>
                              </form>
                           </div>
                        </div>
                        <div class="row mt-3">
                           <!-- <div class="col-12 text-center">
                     <p class="text-muted">Don't have an account? <a href="pages-register.html"
                           class="text-muted ms-1"><b>Sign Up</b></a></p>
                  </div>  -->
                        </div>
                     </div>
                  </div>
               </div>
            </div>
         </div>
      </div>
   </div>
</div>
