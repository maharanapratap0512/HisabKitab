<!-- Begin page -->
<div class="wrapper">
   <div class="content-page">
      <div class="content">
         <div class="container-fluid">

            <div class="row">
               <div class="card-header">Generate Reports (Under Construction)</div>
               <div class="card-body">
                  <div class="row">
                     <!-- Month and Year -->
                     <div class="col-md-3 mb-2">
                        <div class="form-group">
                           <label class="form-label">Month-Year</label>
                           <div class="d-flex justify-content-between">
                              <ng-select class="custom" style="width: 100%;" placeholder="Select Year"
                                 (change)="yearChanged($event)" [clearable]="true" [virtualScroll]="true"
                                 [(ngModel)]="filterBody.year" name="year">
                                 <ng-option selected="selected" disabled value="">Select Year
                                 </ng-option>
                                 <ng-option *ngFor="let item of years" [value]="item">{{item}}</ng-option>
                              </ng-select>
                              <ng-select class="custom" style="width: 100%;" placeholder="Select Month"
                                 [clearable]="true" [virtualScroll]="true" [(ngModel)]="filterBody.month" name="month">
                                 <ng-option selected="selected" disabled value="">Select Month
                                 </ng-option>
                                 <ng-option *ngFor="let item of months" [value]="item.m">{{item.m}} : {{item.name}}
                                 </ng-option>
                              </ng-select>

                           </div>
                        </div>
                     </div>

                     <!-- MM -->
                     <div class="col-md-3 mb-3">
                        <div class="form-group">
                           <label class="form-label">MM</label>
                           <ng-select class="custom" style="width: 100%;" placeholder="MM" [clearable]="true"
                              [virtualScroll]="true" name="mm_id" [(ngModel)]="filterBody.mm_id">
                              <ng-option *ngFor="let item of mms" [value]="item._id">
                                 {{item.mm_hin}}:{{item.mm_eng}} : {{item.mm_code}}</ng-option>
                           </ng-select>
                        </div>
                     </div>
                  </div>
               </div>
            </div>

            <div class="row">
               <!-- help: https://ej2.syncfusion.com/angular/documentation/grid/getting-started/ -->
               <ejs-grid [dataSource]='reportData' [allowPaging]="true" [pageSettings]="pageSettings"
                  [allowSorting]="true" [allowFiltering]="true" height='267px'>
                  <e-columns>
                     <e-column field="roll_no" headerText="Roll No" textAlign="left" width="50"></e-column>
                     <e-column field="pbk_hin" headerText="Pbk Name" textAlign="left" width="90"></e-column>
                     <e-column field="date" headerText="Date" textAlign="left" format="yMd"></e-column>
                     <e-column field="pkt_num" headerText="Pkt Num" textAlign="left"></e-column>
                     <e-column field="mm_hin" headerText="MM" textAlign="left"></e-column>
                     <e-column field="item_hin" headerText="Item" textAlign="left"></e-column>
                     <e-column field="subitem_hin" headerText="Subitem" textAlign="left"></e-column>
                     <e-column field="company_name" headerText="Company" textAlign="left"></e-column>
                     <e-column field="qty" headerText="Qty" textAlign="center" format="N2"></e-column>
                     <e-column field="unit_short" headerText="Unit" textAlign="left"></e-column>
                     <e-column field="condition_hin" headerText="Condition"></e-column>
                     <e-column field="rate" headerText="Rate" textAlign="center" format="C2"></e-column>
                     <e-column field="actual_amt" headerText="Amount" textAlign="center" format="C2"></e-column>
                     <e-column field="aawak_type_hin" headerText="Aawak Type"></e-column>
                     <e-column field="nimitt_hin" headerText="Nimiit"></e-column>
                     <e-column field="item_detail" headerText="Item Detail"></e-column>
                     <e-column field="description" headerText="Description"></e-column>
                  </e-columns>
               </ejs-grid>
            </div>

            <div class="row">
               <div class="card-body" style="overflow: auto;">
                  <table id="datatable-buttons" class="table table-hover dt-responsive" #TABLE>
                     <thead>
                        <tr>
                           <th style="width: 40px;">No.</th>
                           <th>Month</th>
                           <th>Date</th>
                           <th>sthan</th>
                           <th>parchi No</th>
                           <th>qty</th>
                           <th>unit</th>
                           <th>rate</th>
                           <th>cost</th>
                           <th>Plus Minus</th>
                           <th>Total Cost</th>
                           <th>Final Amount</th>
                           <th>Correct Amount</th>
                        </tr>
                     </thead>
                     <tbody>

                     </tbody>
                  </table>
               </div>
            </div>

         </div>
      </div>
   </div>
</div>


<!-- Modal -->
<div class="modal fade" id="showModal" data-bs-backdrop="static" tabindex="-1" aria-labelledby="exampleModalLabel"
   aria-hidden="true">
   <div class="modal-dialog" style="width: 90%;">
      <div class="modal-content">
         <div class="modal-header">
            <h5 class="modal-title" id="exampleModalLabel">{{showModal}}</h5>
            <button type="button" onclick="$('#showModal').modal('hide')" (click)="showModal= ''" class="btn-close"
               aria-label="Close"></button>
         </div>
         <div class="modal-body">

         </div>
         <div class="modal-footer">
            <button type="button" class="btn btn-secondary" style="width: 120px;"
               onclick="$('#showModal').modal('hide')" (click)="showModal= ''">Close</button>
         </div>
      </div>
   </div>
</div>
