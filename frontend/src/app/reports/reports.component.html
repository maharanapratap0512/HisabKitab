<!-- Begin page -->
<div class="wrapper">
   <div class="content-page">
      <div class="content">
         <div class="container-fluid">

            <div class="row">
               <div class="card-header">Select Report</div>
               <div class="mt-1">
                  <div class="d-flex flex-wrap gap-2 mb-1">
                     <button *ngFor="let report of reports" class="btn btn-sm m-1"
                        [ngClass]="selectedReport?.id === report.id ? 'btn-primary' : 'btn-outline-primary'"
                        (click)="selectReport(report)">
                        {{ report.title }}
                     </button>
                  </div>
               </div>
            </div>

            <!-- Report content will be loaded here -->
            <div class="row" *ngIf="selectedReport">
               <div class="col-12">
                  <router-outlet></router-outlet>
               </div>
            </div>

         </div>
      </div>
   </div>
</div>
