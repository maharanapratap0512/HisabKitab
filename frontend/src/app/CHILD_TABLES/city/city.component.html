<ngx-spinner *ngIf="isLoader" bdColor="rgba(0, 0, 0, 0.8)" size="large" color="#fff" type="ball-scale-multiple"
   [fullScreen]="true">
   <p style="color: white"> मैं आत्मा शांत स्वरूप हूँ । </p>
</ngx-spinner>

<!-- Begin page -->
<div class="wrapper">
   <div class="content-page">
      <div class="content">
         <div class="container-fluid">

            <!-- First Row -->
            <!-- Add Button, Search Field, Filter button, Total Count -->
            <div class="row border-bottom border-secondary">
               <div class="card-body">
                  <div class="row d-flex justify-content-between">
                     <div class="col-2">
                        <button class="btn btn-primary w-100" onclick="$('#showModal').modal('show')"
                           (click)="showModal = 'Add City'">
                           <i class="dripicons-plus h4 icon-mx-2"> </i>Add City
                        </button>
                     </div>
                     <div class="col-5">
                        <div class="form-group">
                           <input type="text" class="form-control" placeholder="Search Here" [(ngModel)]="term"
                              name="search">
                        </div>
                     </div>
                     <div class="col-2">
                        <button type="button" style="font-weight: 700 !important;" class="btn btn-light w-100">Total
                           Count : {{total_count}}
                        </button>
                     </div>
                  </div>
               </div>
            </div>

            <div class="row" *ngIf="cityData.length">
               <pagination-controls class="pagi text-end" (pageChange)="page = $event" [autoHide]="true">
               </pagination-controls>
               <div class="card-body" style="overflow: auto;">
                  <table id="datatable-buttons" class="table table-hover dt-responsive">
                     <thead>
                        <tr>
                           <th style="width: 40px;">No.</th>
                           <th style="width: 120px;">Manage</th>
                           <th style="width: 150px;">City(Hin)</th>
                           <th style="width: 150px;">City(Eng)</th>
                           <th style="width: 100px;">State(Hin-Eng)</th>
                        </tr>
                     </thead>
                     <!-- <div style="height: 25px; box-shadow: none; border: none;"></div> -->
                     <tbody>
                        <tr
                           *ngFor="let data of cityData | filter:term | paginate : { itemsPerPage: itemsPerPage, currentPage: page}; let i=index">
                           <td style="font-size: large;">
                              {{itemsPerPage * (page-1) + i+1}}
                              <span class="mx-1"
                                 style="font-size: x-large;position: relative;line-height: 28px; cursor:pointer;"
                                 (click)="protectionToggle(data._id, data.active)">
                                 <i *ngIf="auth.webUser.dept_id == 1 && data.active" data-toggle="tooltip"
                                    title="Protected" class="uil-shield-check text-warning"></i>
                                 <i *ngIf="auth.webUser.dept_id == 1 && !data.active" data-toggle="tooltip"
                                    title="Unprotected" class="uil-shield-slash text-danger"></i>
                              </span>
                           </td>
                           <td>
                              <div *ngIf="auth.webUser.dept_id == 1 || !data.active">
                                 <button class="btn btn-sm btn-primary mx-1" type="button" (click)="edit(data)"><i
                                       class="uil uil-pen"></i></button>
                                 <button class="btn btn-sm btn-danger" type="button" (click)="delete(i,data._id)"><i
                                       class="uil-trash"></i></button>
                              </div>
                              <span *ngIf="auth.webUser.dept_id != 1 && data.active" data-toggle="tooltip"
                                 title="Protected" class="text-warning mx-1"
                                 style="font-size: xx-large;cursor: pointer;line-height: 0px;">
                                 <i class="uil-shield-check"></i>
                              </span>
                           </td>
                           <td>{{data.city_hin}}</td>
                           <td>{{data.city_eng}}</td>
                           <td>{{data.state_id?(data.state_hin + ' : ' + data.state_eng):'-'}}</td>
                        </tr>
                     </tbody>
                  </table>
               </div>
               <pagination-controls class="pagi text-center" (pageChange)="page = $event" [autoHide]="true">
               </pagination-controls>
            </div>

            <h2 class="text-center m-5" *ngIf="!cityData.length">No Data!</h2>
         </div>
      </div>
   </div>
</div>



<!-- addCITY Modal -->
<div class="modal fade" id="showModal" data-bs-backdrop="static" tabindex="-1" aria-labelledby="exampleModalLabel"
   aria-hidden="true">
   <div class="modal-dialog" style="width: 90%;">
      <div class="modal-content">
         <div class="modal-header">
            <h5 class="modal-title" id="exampleModalLabel">{{showModal}}</h5>
            <button type="button" onclick="$('#showModal').modal('hide')" (click)="showModal= ''" class="btn-close"
               aria-label="Close"></button>
         </div>
         <div class="modal-body">
            <app-city-entry *ngIf="showModal == 'Add City'" (response)='addCITYResponse($event)'></app-city-entry>
            <app-city-entry *ngIf="showModal == 'Edit City'" (response)='editCITYResponse($event)' [getData]="editData"
               [isEdit]="true"></app-city-entry>
         </div>
         <div class="modal-footer">
            <button type="button" class="btn btn-secondary" style="width: 120px;"
               onclick="$('#showModal').modal('hide')" (click)="showModal= ''">Close</button>
         </div>
      </div>
   </div>
</div>
