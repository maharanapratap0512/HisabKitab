<ngx-spinner *ngIf="isLoader" bdColor="rgba(0, 0, 0, 0.8)" size="small" color="#fff" type="ball-scale-multiple"
   [fullScreen]="true">
   <p style="color: white"> मैं आत्मा शांत स्वरूप हूँ । </p>
</ngx-spinner>

<!-- Begin page -->
<div class="wrapper">
   <div class="content-page">
      <div class="content">
         <div class="container-fluid">

            <!-- First Row -->
            <!-- Add Button, Search Field, Filter button, Total Count -->
            <div class="row border-bottom border-secondary">
               <div class="card-body" style="overflow: auto;">
                  <div class="row justify-content-between">
                     <div class="col-2">
                        <button class="btn btn-primary w-100" *ngIf="settings.category.add"
                           onclick="$('#showModal').modal('show')" (click)="showModal = 'Add Category'">
                           <i class="dripicons-plus h4 icon-mx-2"> </i>Add Category
                        </button>
                     </div>
                     <div class="col-5">
                        <!-- <div class="input-group">
                           <input type="text" class="form-control dropdown-toggle" placeholder="Search..."
                              id="top-search" [(ngModel)]="term" name="search">
                           <span class="mdi mdi-magnify search-icon"></span>
                           <button class="input-group-text btn-primary" type="submit">Search</button>
                        </div> -->
                        <div class="form-group">
                           <input type="text" class="form-control" placeholder="Search Here" [(ngModel)]="term"
                              name="search">
                        </div>
                     </div>
                     <div class="col-3">
                        <div class="d-flex justify-content-between">
                           <button class="btn btn-outline-success" (click)="exportToExcel()">Export To Excel</button>
                           <button class="file btn btn-success" style="font-weight: 700 !important;">
                              <i class="uil uil-arrow-to-bottom"></i> Import
                              <input type="file" class="inputtag"
                                 accept=".csv, application/vnd.openxmlformats-officedocument.spreadsheetml.sheet, application/vnd.ms-excel"
                                 (change)="excelImport($event)" />
                           </button>
                        </div>
                     </div>
                     <div class="col-2">
                        <button type="button" style="font-weight: 700 !important;" class="btn btn-light w-100">Total
                           Count : {{categoryData.length?categoryData.length:'-'}}
                        </button>
                     </div>
                  </div>
               </div>
            </div>

            <div class="row" *ngIf="categoryData.length">
               <div class="card-body" style="overflow: auto;">
                  <table id="datatable-buttons" class="table table-hover dt-responsive">
                     <thead>
                        <tr>
                           <th style="width: 80px;">No.</th>
                           <th>Manage</th>
                           <th>Category (Hin)</th>
                           <th>Category (Eng)</th>
                           <th>Category (Roman)</th>
                        </tr>
                     </thead>
                     <tbody>
                        <tr *ngFor="let data of categoryData | search:term; let i=index">
                           <td style="font-size: large;">
                              {{i+1}}
                              <span class="mx-1"
                                 style="font-size: x-large;position: relative;line-height: 28px;cursor: pointer;"
                                 (click)="protectionToggle(data._id, data.active)">
                                 <i *ngIf="gs.exceptionDept.includes(auth.webUser.dept_id) && data.active"
                                    data-toggle="tooltip" title="Protected" class="uil-shield-check text-warning"></i>
                                 <i *ngIf="gs.exceptionDept.includes(auth.webUser.dept_id) && !data.active"
                                    data-toggle="tooltip" title="Unprotected" class="uil-shield-slash text-danger"></i>
                              </span>
                           </td>
                           <td>
                              <div *ngIf="gs.exceptionDept.includes(auth.webUser.dept_id) || !data.active">
                                 <button class="btn btn-sm btn-primary mx-1" type="button" (click)="edit(data)"><i
                                       class="uil uil-pen"></i></button>
                                 <button class="btn btn-sm btn-danger" type="button" (click)="delete(i,data._id)"><i
                                       class="uil-trash"></i></button>
                              </div>
                              <span *ngIf="!gs.exceptionDept.includes(auth.webUser.dept_id) && data.active"
                                 data-toggle="tooltip" title="Protected" class="text-warning mx-1"
                                 style="font-size: xx-large;cursor: pointer;line-height: 0px;">
                                 <i class="uil-shield-check"></i>
                              </span>

                           </td>
                           <td>{{data.category_hin}}</td>
                           <td>{{data.category_eng}}</td>
                           <td>{{data.category_roman}}</td>
                        </tr>
                     </tbody>
                  </table>
               </div>
            </div>
         </div>
      </div>
   </div>
</div>



<!-- addCategory Modal -->
<div class="modal fade" id="showModal" data-bs-backdrop="static" tabindex="-1" aria-labelledby="exampleModalLabel"
   aria-hidden="true">
   <div class="modal-dialog" style="width: 90%;">
      <div class="modal-content">
         <div class="modal-header">
            <h5 class="modal-title" id="exampleModalLabel">{{showModal}}</h5>
            <button type="button" onclick="$('#showModal').modal('hide')" (click)="showModal= ''" class="btn-close"
               aria-label="Close"></button>
         </div>
         <div class="modal-body">
            <app-category-entry *ngIf="showModal == 'Add Category'" (response)='addCategoryResponse($event)'>
            </app-category-entry>
            <app-category-entry *ngIf="showModal == 'Edit Category'" (response)='editCategoryResponse($event)'
               [getData]="editData" [isEdit]="true"></app-category-entry>
            <app-excel-import *ngIf='showModal == "ei_category"' importType="category" [excelFile]="excelFile"
               (response)="importResponse('category')"></app-excel-import>
         </div>
         <div class="modal-footer">
            <button type="button" class="btn btn-secondary" style="width: 120px;"
               onclick="$('#showModal').modal('hide')" (click)="showModal= ''">Close</button>
         </div>
      </div>
   </div>
</div>
