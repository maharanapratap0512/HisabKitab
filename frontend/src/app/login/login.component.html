<div class="authentication-bg">

   <div class="account-pages pt-2 pt-sm-5 pb-4 pb-sm-5">
      <div class="container">
         <div class="row justify-content-center">
            <div class="col-xxl-3 col-lg-4 centered">
               <div class="card">

                  <!-- Logo -->
                  <div class="card-header pt-4 pb-4 text-center bg-primary">
                     <a routerLink="dashboard" class="topnav-logo">
                        <span class="topnav-logo-lg">
                           <img src="assets\favicon_io\android-chrome-512x512.png" alt="" height="60">
                        </span>
                        <span class="hk mx-2 h3 text-white"><strong><u>HISAB KITAB</u></strong></span>
                        <!-- <span class="topnav-logo-sm">
                           <img src="assets/images/logo_sm_dark.png" alt="" height="16">
                        </span> -->
                     </a>
                     <!-- <a>
                        <span><img src="assets/images/logo.png" alt="" height="18"></span>
                     </a> -->
                  </div>

                  <div class="card-body p-4">

                     <div class="text-center w-75 m-auto">
                        <h4 class="text-dark-50 text-center pb-0 fw-bold">Sign In</h4>
                        <p class="text-muted mb-4">Enter your Department and password to access the software.</p>
                     </div>

                     <form [formGroup]="loginForm">
                        <!-- <div class=" mb-5">
                           <select class="form-control mm" style="width: 100%;" formControlName="role">
                              <option selected="selected" value="">Select Role</option>
                              <option value="rajkot">Rajkot</option>
                              <option value="surat">Surat</option>
                              <option value="delhi">Delhi</option>
                              <option value="kampil">Kampil</option>
                              <option value="aagra">Aagra</option>
                              <option value="mount abu">Mount Abu</option>
                           </select>
                        </div> -->

                        <div class="mb-3">
                           <label class="form-label">Select Departments</label>
                           <ng-select class="custom" style="width: 100%;" placeholder="Select Department"
                              [clearable]="false" [virtualScroll]="true" formControlName="dept_id"
                              (change)="deptSelected($event)"
                              [ngClass]="{'validation':loginForm.get('dept_id')?.errors && (loginForm.get('dept_id')?.touched || loginForm.get ('dept_id')?.dirty)}">
                              <ng-option selected="selected" disabled value="">Select Department</ng-option>
                              <ng-option *ngFor="let item of departments" [value]="item._id">
                                 {{item.dept_eng}} : {{item.dept_hin}}{{item.dept_code?' :
                                 '+item.dept_code:''}}</ng-option>
                           </ng-select>
                        </div>

                        <div class="mb-3" *ngIf="showMM">
                           <label class="form-label">Select MM</label>
                           <ng-select *ngIf="showMM" class="custom" style="width: 100%;" placeholder="Select MM"
                              [clearable]="false" [virtualScroll]="true" formControlName="mm_id"
                              [ngClass]="{'validation':loginForm.get('mm_id')?.errors && (loginForm.get('mm_id')?.touched || loginForm.get ('mm_id')?.dirty)}">
                              <ng-option selected="selected" disabled value="">Select MM</ng-option>
                              <ng-option *ngFor="let item of mms" [value]="item._id">
                                 {{item.mm_hin}} : {{item.mm_eng}}{{item.mm_code?' : '+item.mm_code:''}}</ng-option>
                           </ng-select>
                        </div>

                        <div class="mb-3">
                           <!-- <a class="text-muted float-end">
                              <small>Forgot your password?</small>
                           </a> -->
                           <label for="password" class="form-label">Password</label>
                           <div class="input-group input-group-merge">
                              <input [type]="passType" id="password" class="form-control"
                                 placeholder="Enter your password" formControlName="password"
                                 [ngClass]="{'validation':loginForm.get('password')?.errors && (loginForm.get('password')?.touched || loginForm.get ('password')?.dirty)}">
                              <div class="input-group-text" data-password="false">
                                 <span class="password-eye"></span>
                              </div>
                           </div>
                        </div>

                        <!-- <div class="mb-3 mb-3">
                           <div class="form-check">
                              <input type="checkbox" class="form-check-input" id="checkbox-signin" checked>
                              <label class="form-check-label" for="checkbox-signin">Remember me</label>
                           </div>
                        </div> -->

                        <div class="mb-3 mb-0 text-center">
                           <button class="btn btn-primary" type="submit" (click)="loginSubmit()"> Log In </button>
                        </div>
                     </form>
                  </div>
               </div>
               <div class="row mt-3">
                  <!-- <div class="col-12 text-center">
                     <p class="text-muted">Don't have an account? <a href="pages-register.html"
                           class="text-muted ms-1"><b>Sign Up</b></a></p>
                  </div>  -->
               </div>
            </div>
         </div>
      </div>
   </div>
</div>
