<ngx-spinner *ngIf="isLoader" bdColor="rgba(0, 0, 0, 0.8)" size="large" color="#fff" type="ball-scale-multiple"
   [fullScreen]="true">
   <p style="color: white"> मैं आत्मा शांत स्वरूप हूँ । </p>
</ngx-spinner>

<div class="card card-body">
   <div class="row">
      <div class="col-md-2">
         <!-- <div class="form-group"> -->
         <!-- <label class="form-label">Import Type</label> -->
         <ng-select class="custom" style="width: 100%;" placeholder="Select Import Type" [clearable]="true" (change)="headerConfig = EIService.config[$event]"
            [virtualScroll]="true" [(ngModel)]="importType" [ngModelOptions]="{standalone: true}">
            <ng-option selected="selected" disabled value="">Select MM</ng-option>
            <ng-option *ngFor="let item of EIService.import_list" [value]="item.name">
               {{item.name}}</ng-option>
         </ng-select>
         <!-- </div> -->
      </div>
      <div class="col-md-3">
         <button *ngIf="importType" class="file btn btn-success" style="font-weight: 700 !important;">
            <i class="uil uil-arrow-to-bottom"></i> Select Excel File
            <input type="file" class="inputtag"
               accept=".csv, application/vnd.openxmlformats-officedocument.spreadsheetml.sheet, application/vnd.ms-excel"
               (change)="excelImport($event)" />
         </button>
      </div>
      <div class="col-md-3">
         <div class="form-check form-switch">
            <input type="checkbox" id="isHeader2" [(ngModel)]="is2Header" [ngModelOptions]="{standalone: true}"
               class="form-check-input">
            <label class="form-check-label" for="isHeader2">has 2 header row</label>
         </div>
      </div>
      <div class="col-md-2"></div>
      <div class="col-md-2">
         <button class="btn btn-primary" (click)="nextClick()" *ngIf="nextButton">Next</button>
      </div>

   </div>
   <!-- row for header listing -->
   <div class="row mt-2" style="display: block;" *ngIf="importType">
      <b>Comulns List : </b>
      <span *ngFor="let col of headerConfig" [ngClass]="{'text-danger':col.not_null}">{{col.name}}
         <i class="mdi mdi-check-circle-outline text-success" *ngIf="col.found"></i> 
      </span>
   </div>
</div>

<div class="row" *ngIf="excelArr && excelArr.length > 0">
   <div class="card card-body" style="overflow: auto;">
      <table class="table-hover dt-responsive">
         <thead>
            <td>Header</td>
            <td *ngIf="is2Header">Sub Header</td>
         </thead>
         <tbody>
            <tr *ngFor="let row of excelArr; let i=index;">
               <td>
                  <div class="form-check">
                     <input type="radio" id="{{'Header'+i}}" [(ngModel)]="header1" [ngModelOptions]="{standalone: true}" (change)="headerChanged(i)"
                        [value]="i" name="headerRadio" class="form-check-input">
                  </div>
               </td>
               <td *ngIf="is2Header">
                  <div class="form-check">
                     <input type="radio" id="{{'Subheader'+i}}" [(ngModel)]="header2"
                        [ngModelOptions]="{standalone: true}" name="subHeaderRadio" class="form-check-input">
                  </div>
               </td>
               <td *ngFor="let cell of row;">
                  {{cell}}
               </td>
            </tr>
         </tbody>
      </table>
   </div>
</div>
