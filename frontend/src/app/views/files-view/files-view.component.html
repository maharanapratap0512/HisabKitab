<ngx-spinner *ngIf="isLoader" bdColor="rgba(0, 0, 0, 0.8)" size="large" color="#fff" type="ball-scale-multiple"
    [fullScreen]="true">
    <p style="color: white"> प्रोसेसिंग हो रही है... </p>
</ngx-spinner>

<div id="fileViewComponent">
    <div class="gallery-grid">
        <!-- Upload Card -->
        <div class="file-card upload-card" (click)="uploadDocument.click()">
            <input type="file" #uploadDocument (change)="changeDocument($event)" hidden accept="image/*" />
            <i class="uil-image-plus"></i>
            <span>Add New</span>
        </div>

        <!-- Image Cards -->
        <div class="file-card" *ngFor="let file of imageName; let i = index" [class.selected]="file.isChecked"
            (click)="toggleSelection(file)">
            
            <!-- Selection Badge -->
            <div class="selection-badge">
                <i class="mdi mdi-check"></i>
            </div>

            <!-- Image Preview -->
            <img [src]="baseUrl + imageFolder + file.doc" [alt]="file.doc" loading="lazy" />
            
            <!-- Overlay for Hover -->
            <div class="card-overlay"></div>

            <!-- Actions Bar -->
            <div class="card-actions" (click)="$event.stopPropagation()">
                <button class="action-btn preview-btn" title="Preview" (click)="previewImage(file)">
                    <i class="mdi mdi-eye"></i>
                </button>
                <button class="action-btn delete-btn" title="Delete" (click)="imageDelete(file.doc)">
                    <i class="mdi mdi-trash-can-outline"></i>
                </button>
            </div>

            <!-- File Name Info -->
            <div class="file-info">
                {{ file.doc }}
            </div>
        </div>
    </div>

    <!-- Footer Actions -->
    <div class="footer-actions">
        <button class="btn btn-primary btn-submit" type="button" (click)="imageSubmit()">
            Confirm Selection
        </button>
    </div>
</div>
