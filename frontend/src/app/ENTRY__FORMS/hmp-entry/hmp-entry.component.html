<ngx-spinner *ngIf="isLoader" bdColor="rgba(0, 0, 0, 0.8)" size="large" color="#fff" type="ball-scale-multiple"
    [fullScreen]="true">
    <p style="color: white"> Processing Batch... </p>
</ngx-spinner>

<div class="row material-theme-container" id="hmpEntryComponent">
    <div class="card-body">
        <form #fHmp="ngForm">

            <!-- Top Section: Batch & Recipe Info -->
            <div class="row mb-3">
                <div class="col-md-2">
                    <label class="form-label">Date</label>
                    <input type="date" class="form-control" [(ngModel)]="fs.hmpBatchForm.date" name="date" required>
                </div>
                <div class="col-md-2">
                    <label class="form-label">Batch No</label>
                    <input type="text" class="form-control" placeholder="Auto" [(ngModel)]="fs.hmpBatchForm.batch_no"
                        name="batch_no" readonly>
                </div>
                <div class="col-md-2">
                    <label class="form-label">Location (MM)</label>
                    <ng-select class="custom" [items]="mms" bindLabel="mm_hin" bindValue="_id"
                        [(ngModel)]="fs.hmpBatchForm.mm_id" name="mm_id" placeholder="Select Location" required>
                    </ng-select>
                </div>

                <!-- Recipe Selection -->
                <div class="col-md-4">
                    <label class="form-label">Recipe</label>
                    <ng-select class="custom" [items]="recipes" bindLabel="recipe_name" bindValue="_id"
                        [(ngModel)]="fs.hmpBatchForm.recipe_id" name="recipe_id" (change)="onRecipeSelect($event)"
                        [addTag]="true" (add)="onRecipeNameChange($event)" placeholder="Select or Type New Recipe">
                    </ng-select>
                </div>
                <div class="col-md-2 d-flex align-items-end">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" [(ngModel)]="fs.hmpBatchForm.update_recipe"
                            name="update_recipe" id="updateRecipe">
                        <label class="form-check-label" for="updateRecipe">
                            Update/Save Recipe
                        </label>
                    </div>
                </div>
            </div>

            <!-- Recipe Details (Editable if needed) -->
            <div class="row mb-3"
                *ngIf="fs.hmpBatchForm.recipe_id || fs.hmpBatchForm.recipe_name || fs.hmpBatchForm.update_recipe">
                <div class="col-md-3">
                    <input type="text" class="form-control form-control-sm" placeholder="Recipe Name"
                        [(ngModel)]="fs.hmpBatchForm.recipe_name" name="recipe_name">
                </div>
                <div class="col-md-2">
                    <input type="text" class="form-control form-control-sm" placeholder="Recipe Code"
                        [(ngModel)]="fs.hmpBatchForm.recipe_code" name="recipe_code">
                </div>
                <div class="col-md-7">
                    <input type="text" class="form-control form-control-sm" placeholder="Description / Instructions"
                        [(ngModel)]="fs.hmpBatchForm.recipe_description" name="recipe_description">
                </div>
            </div>

            <hr>

            <!-- Split View: Inputs & Outputs -->
            <div class="row">

                <!-- Left: Inputs (Consumption) -->
                <div class="col-md-6 border-end">
                    <h5 class="text-secondary">Input Materials (Consumed)</h5>
                    <div class="table-container" style="max-height: 400px; overflow: auto;">
                        <table class="table table-sm table-bordered">
                            <thead class="table-light">
                                <tr>
                                    <th width="5%">#</th>
                                    <!-- <th width="15%">Lot</th> -->
                                    <th width="35%">Item</th>
                                    <th width="15%">Qty</th>
                                    <th width="15%">Rate</th>
                                    <!-- <th width="15%">Amount</th> -->
                                </tr>
                            </thead>
                            <tbody>
                                <tr *ngFor="let row of fs.hmpBatchForm.inputs; let i = index">
                                    <td>{{i+1}}</td>
                                    <!-- Lot No -->
                                    <!-- <td>
                                        <div class="ng-autocomplete">
                                            <ng-autocomplete [data]="lotNos" [searchKeyword]="keyword"
                                                class="form-control-sm" placeholder="lot"
                                                (selected)='selectLotEvent($event, i)' [itemTemplate]="itemTemplate"
                                                [notFoundTemplate]="notFoundTemplate">
                                            </ng-autocomplete>
                                            <ng-template #itemTemplate let-item>
                                                <a [innerHTML]="item.lot_no"></a>
                                            </ng-template>
                                            <ng-template #notFoundTemplate let-notFound>
                                                <div [innerHTML]="notFound"></div>
                                            </ng-template>
                                        </div>
                                    </td> -->
                                    <!-- Item Dropdown -->
                                    <td>
                                        <ng-select class="custom-sm" [clearable]="true" [virtualScroll]="true"
                                            [(ngModel)]="row.item_subitem_id" name="in_item_{{i}}"
                                            (change)="itemSubitemSelectedInput($event, i)" placeholder="Item">
                                            <ng-container *ngFor="let item of items">
                                                <ng-option [value]="item._id + ':'">{{item.item_hin}}</ng-option>
                                                <ng-option *ngFor="let sub of item.subitems"
                                                    [value]="item._id + ':' + sub._id">
                                                    -- {{sub.subitem_hin}}
                                                </ng-option>
                                            </ng-container>
                                        </ng-select>
                                    </td>
                                    <!-- Qty & Unit -->
                                    <td>
                                        <div class="d-flex align-items-center">
                                            <input type="number" class="form-control-sm" [(ngModel)]="row.qty"
                                                name="in_qty_{{i}}" (change)="calculateAmountInput(i)" style="flex: 1;">
                                            <ng-select class="custom-sm" [items]="units" bindLabel="unit_short"
                                                style="flex: 2;" bindValue="_id" [(ngModel)]="row.unit_id"
                                                name="in_unit_{{i}}" [clearable]="false"></ng-select>
                                        </div>
                                    </td>
                                    <!-- Rate -->
                                    <td>
                                        <input type="number" class="form-control form-control-sm" [(ngModel)]="row.rate"
                                            name="in_rate_{{i}}" (change)="calculateAmountInput(i)">
                                    </td>
                                    <!-- Amount -->
                                    <!-- <td>
                                        <input type="text" class="form-control form-control-sm" [(ngModel)]="row.amount"
                                            name="in_amt_{{i}}" readonly>
                                    </td> -->
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- Right: Outputs (Production) -->
                <div class="col-md-6">
                    <h5 class="text-primary">Output Products (Produced)</h5>
                    <div class="table-container" style="max-height: 400px; overflow: auto;">
                        <table class="table table-sm table-bordered">
                            <thead class="table-light">
                                <tr>
                                    <th width="5%">#</th>
                                    <th width="35%">Item</th>
                                    <th width="20%">Qty</th>
                                    <th width="20%">Rate</th>
                                    <!-- <th width="20%">Amount</th> -->
                                </tr>
                            </thead>
                            <tbody>
                                <tr *ngFor="let row of fs.hmpBatchForm.outputs; let i = index">
                                    <td>{{i+1}}</td>
                                    <!-- Item Dropdown -->
                                    <td>
                                        <ng-select class="custom-sm" [clearable]="true" [virtualScroll]="true"
                                            [(ngModel)]="row.item_subitem_id" name="out_item_{{i}}"
                                            (change)="itemSubitemSelectedOutput($event, i)" placeholder="Item">
                                            <ng-container *ngFor="let item of items">
                                                <ng-option [value]="item._id + ':'">{{item.item_hin}}</ng-option>
                                                <ng-option *ngFor="let sub of item.subitems"
                                                    [value]="item._id + ':' + sub._id">
                                                    -- {{sub.subitem_hin}}
                                                </ng-option>
                                            </ng-container>
                                        </ng-select>
                                    </td>
                                    <!-- Qty & Unit -->
                                    <td>
                                        <div class="input-group input-group-sm">
                                            <input type="number" class="form-control" [(ngModel)]="row.qty"
                                                name="out_qty_{{i}}" (change)="calculateAmountOutput(i)">
                                            <span class="input-group-text" style="font-size: 0.7rem;">
                                                <ng-select class="custom-sm" [items]="units" bindLabel="unit_short"
                                                    bindValue="_id" [(ngModel)]="row.unit_id" name="out_unit_{{i}}"
                                                    [clearable]="false"></ng-select>
                                            </span>
                                        </div>
                                    </td>
                                    <!-- Rate -->
                                    <td>
                                        <input type="number" class="form-control form-control-sm" [(ngModel)]="row.rate"
                                            name="out_rate_{{i}}" (change)="calculateAmountOutput(i)">
                                    </td>
                                    <!-- Amount -->
                                    <!-- <td>
                                        <input type="text" class="form-control form-control-sm" [(ngModel)]="row.amount"
                                            name="out_amt_{{i}}" readonly>
                                    </td> -->
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

            </div>

            <!-- Bottom Actions -->
            <div class="row mt-4">
                <div class="col-md-12 text-center">
                    <button class="btn btn-secondary me-2" (click)="closeModal()">Cancel</button>
                    <button class="btn btn-primary" (click)="onSubmit()">Save Batch</button>
                </div>
            </div>

        </form>
    </div>
</div>
