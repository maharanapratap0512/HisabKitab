<div class="row" id="itemComponent">
    <div class="col-12" *ngIf="!isEditForm">
        <div class="float-end">
            <button class="btn btn-sm btn-outline-primary" (click)="isEditForm=true">Edit Form</button>
        </div>
    </div>
    <div class="col-12 card" *ngIf="isEditForm">
        <div class="row card-body">
            <div class="col-2 col-md-2 col-sm-4 ps-0" *ngFor="let cntrl of auth.settingsUI.item">
                <div class="form-check form-switch">
                    <input type="checkbox" class="form-check-input"
                        [(ngModel)]="auth.webUser.settings.item[cntrl.colName]" [ngModelOptions]="{standalone: true}">
                    <label class="form-check-label" for="customSwitch2">{{cntrl.title}}</label>
                </div>
            </div>
            <div class="col-2 float-end"><button class="btn btn-sm btn-success" (click)="saveFormSettings()">Save</button></div>
        </div>
    </div>
    <div class="card-body">
        <form [formGroup]="itemForm">
            <div class="row">
                <div class="col-md-3 mb-3">
                    <div class="form-group">
                        <label class="form-label">Item Name (Hin)</label>
                        <input type="text" class="form-control" placeholder="Item Name (Hin)" formControlName="item_hin"
                            [ngClass]="{'validation':itemForm.get('item_hin')?.errors && (itemForm.get('item_hin')?.touched || itemForm.get ('item_hin')?.dirty)}">
                    </div>
                </div>
                <div class="col-md-3 mb-3" *ngIf="settings.item_eng">
                    <div class="form-group">
                        <label class="form-label">Item Name (Eng)</label>
                        <input type="text" class="form-control" placeholder="Item Name (Eng)" formControlName="item_eng"
                            [ngClass]="{'validation':itemForm.get('item_eng')?.errors && (itemForm.get('item_eng')?.touched || itemForm.get ('item_eng')?.dirty)}">
                    </div>
                </div>
                <div class="col-md-3 mb-3" *ngIf="settings.item_roman">
                    <div class="form-group">
                        <label class="form-label">Item Name (Roman)</label>
                        <input type="text" class="form-control" placeholder="Item Name (Roman)"
                            formControlName="item_roman"
                            [ngClass]="{'validation':itemForm.get('item_roman')?.errors && (itemForm.get('item_roman')?.touched || itemForm.get ('item_roman')?.dirty)}">
                    </div>
                </div>
                <div class="col-md-3 mb-3" *ngIf="settings.item_code">
                    <div class="form-group">
                        <label class="form-label">Item Code</label>
                        <input type="text" class="form-control" placeholder="Item Code" formControlName="item_code"
                            [ngClass]="{'validation':itemForm.get('item_code')?.errors && (itemForm.get('item_code')?.touched || itemForm.get ('item_code')?.dirty)}">
                    </div>
                </div>

                <div class="col-md-3 mb-3">
                    <div class="form-group">
                        <label class="form-label">Category</label>
                        <div class="float-end">
                            <a type="button" 
                                style="padding: 1px 6px !important; margin-right: 2px !important;"
                                class="btn btn-sm btn-outline-primary" (click)="setView('Category')"><i
                                    class=" dripicons-view-list"></i></a>
                            <a type="button" style="padding: 1px 6px !important;"
                                class="btn btn-outline-primary float-end"
                                onclick="$('#itemComponent > #showModal').modal('show')"
                                (click)="showModal = 'Add Category'" *ngIf="mainSettings.category.add">+
                                Add</a>
                        </div>
                        <ng-select class="custom" style="width: 100%;" placeholder="Select Category" [clearable]="true"
                            [virtualScroll]="true" [multiple]="true" formControlName="categories"
                            [ngClass]="{'validation':itemForm.get('categories')?.errors && (itemForm.get('categories')?.touched || itemForm.get ('categories')?.dirty)}">
                            <ng-option selected="selected" disabled value="">Select Category</ng-option>
                            <ng-option *ngFor="let item of categories" [value]="item._id">
                                {{item.category_hin}} <span class="text-muted small" *ngIf="item.category_eng">: {{item.category_eng}}</span> <small class="text-muted fst-italic" *ngIf="item.category_roman">: {{item.category_roman}}</small>
                            </ng-option>
                        </ng-select>
                    </div>
                </div>
                <div class="col-md-2 mb-3">
                    <div class="form-group">
                        <label class="form-label">Default Unit</label>
                        <div class="float-end">
                            <a type="button" style="padding: 1px 6px !important; margin-right: 2px !important;"
                                class="btn btn-sm btn-outline-primary" (click)="setView('Unit')">
                                <i class=" dripicons-view-list"></i>
                            </a>
                            <a type="button" style="padding: 1px 6px !important;"
                                class="btn btn-outline-primary float-end"
                                onclick="$('#itemComponent > #showModal').modal('show')"
                                (click)="showModal = 'Add Unit'"  *ngIf="settings.add">+
                                Add
                            </a>
                        </div>
                        <ng-select class="custom" style="width: 100%;" placeholder="Select Default Unit"
                            [clearable]="true" [virtualScroll]="true" formControlName="unit_id"
                            [ngClass]="{'validation':itemForm.get('unit_id')?.errors && (itemForm.get('unit_id')?.touched || itemForm.get ('unit_id')?.dirty)}">
                            <ng-option selected="selected" disabled value="">Select Default Unit</ng-option>
                            <ng-option *ngFor="let item of units" [value]="item._id">{{item.unit_short}} :
                                {{item.unit_full}}</ng-option>
                        </ng-select>
                    </div>
                </div>
                <div class="col-md-3 mb-3" *ngIf="settings.price_range">
                    <div class="form-group">
                        <label class="form-label">Price Range</label>
                        <div class="d-flex justify-content-between">
                            <input type="number" class="form-control pr-2" placeholder="Min..."
                                formControlName="min_rate"
                                [ngClass]="{'validation':itemForm.get('min_rate')?.errors && (itemForm.get('min_rate')?.touched || itemForm.get ('min_rate')?.dirty)}">
                            <input type="number" class="form-control" placeholder="Max..." formControlName="max_rate"
                                [ngClass]="{'validation':itemForm.get('max_rate')?.errors && (itemForm.get('max_rate')?.touched || itemForm.get ('max_rate')?.dirty)}">
                        </div>
                    </div>
                </div>
                <div class="col-md-3 mb-3" *ngIf="settings.extra_note">
                    <div class="form-group">
                        <label class="form-label">Extra Note</label>
                        <textarea class="form-control" placeholder="Extra Note" formControlName="extra_note"
                            [ngClass]="{'validation':itemForm.get('extra_note')?.errors && (itemForm.get('extra_note')?.touched || itemForm.get ('extra_note')?.dirty)}"></textarea>
                    </div>
                </div>
                <div class="col-md-4 mb-3" *ngIf="settings.document">
                    <div class="form-group image-upload-group">
                        <label class="form-label">Images / Documents</label>
                        <div (click)="showModal='Add Image'; editDoc=itemForm.value.document"
                             onclick="$('#itemComponent > #showModal').modal('show')"
                             class="image-preview-container d-flex flex-wrap align-items-center gap-2 p-2 rounded">
                            
                            <ng-container *ngIf="imagepath && imagepath.length > 0; else noImages">
                                <div class="preview-thumb" *ngFor="let img of imagepath">
                                    <img [src]="api.getUrl('BASE') + img" alt="preview" loading="lazy" />
                                </div>
                                <div class="add-more-indicator ms-2">
                                    <i class="mdi mdi-plus-circle-outline"></i>
                                </div>
                            </ng-container>

                            <ng-template #noImages>
                                <div class="empty-state d-flex align-items-center gap-2 text-muted">
                                    <i class="uil-image-plus"></i>
                                    <span>Click to Add Images</span>
                                </div>
                            </ng-template>
                        </div>
                    </div>
                </div>
                <div class="col-md-2 mb-3">
                    <div class="form-group">
                        <button class="btn btn-primary submit" type="submit" *ngIf="!isEdit"
                            (click)="itemFormSubmit()">Submit</button>
                        <button class="btn btn-warning submit" type="submit" *ngIf="isEdit"
                            (click)="itemFormUpdate()">Update</button>
                    </div>
                    <!-- <button class="btn btn-light submit mx-3" type="button" (click)="itemForm.reset()">Clear</button> -->
                </div>
            </div>
        </form>
    </div>



    <!-- Modal -->
    <div class="modal fade" id="showModal" data-bs-backdrop="static" tabindex="-1" aria-labelledby="exampleModalLabel"
        aria-hidden="true">
        <div class="modal-dialog" style="width: 90%;">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="exampleModalLabel">{{showModal}}</h5>
                    <button type="button" class="btn-close" onclick="$('#itemComponent > #showModal').modal('hide')"
                        (click)="showModal = ''" aria-label="Close"></button>
                </div>
                <div class="modal-body">

                    <app-unit-entry *ngIf=" showModal=='Add Unit'" (response)="unitAddResponse($event)">
                    </app-unit-entry>

                    <app-category-entry *ngIf="showModal == 'Add Category'" (response)="categoryAddResponse($event)">
                    </app-category-entry>

                    <!-- Add Image -->
                    <app-files-view *ngIf="showModal == 'Add Image'" (response)="imagesSelectResponse($event)"
                        [getData]="editDoc" [isEdit]="true" type="item">
                    </app-files-view>
                </div>
                <div class="modal-footer">
                    <div class="form-check form-switch">
                        <input type="checkbox" class="form-check-input" [(ngModel)]="auto_close"
                            [ngModelOptions]="{standalone: true}">
                        <label class="form-check-label" for="customSwitch2">Auto Close</label>
                    </div>
                    <button type="button" class="btn btn-secondary" style="width: 120px;"
                        onclick="$('#itemComponent > #showModal').modal('hide')" (click)="showModal = ''">Close</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Data View For Small List -->
    <div class="modal fade" id="dataView" data-bs-backdrop="static" tabindex="-1" aria-labelledby="exampleModalLabel"
        aria-hidden="true">
        <div class="modal-dialog" style="width: 90%;">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="exampleModalLabel">{{viewType}} DATA-VIEW</h5>
                    <button type="button" class="btn-close" onclick="$('#itemComponent > #dataView').modal('hide')"
                        aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <app-data-view *ngIf="viewType == 'Unit'" [getData]="viewData" Type="unit"></app-data-view>
                    <app-data-view *ngIf="viewType == 'Category'" [getData]="viewData" Type="category"></app-data-view>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" style="width: 120px;"
                        onclick="$('#itemComponent > #dataView').modal('hide')">Close</button>
                </div>
            </div>
        </div>
    </div>

</div>
