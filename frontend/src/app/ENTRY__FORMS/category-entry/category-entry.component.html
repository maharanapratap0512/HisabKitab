<div class="row">
    <div class="card-body">
        <form [formGroup]="categoryForm">
            <div class="row">
                <div class="col-md-3 mb-3">
                    <div class="form-group">
                        <label class="form-label">Category Name (Hin)</label>
                        <input type="text" class="form-control" placeholder="Category Name (Hin)"
                            formControlName="category_hin"
                            [ngClass]="{'validation':categoryForm.get('category_hin')?.errors && (categoryForm.get('category_hin')?.touched || categoryForm.get ('category_hin')?.dirty)}">
                    </div>
                </div>
                <div class="col-md-3 mb-3" *ngIf="settings.category_eng">
                    <div class="form-group">
                        <label class="form-label">Category Name (Eng)</label>
                        <input type="text" class="form-control" placeholder="Category Name (Eng)"
                            formControlName="category_eng"
                            [ngClass]="{'validation':categoryForm.get('category_eng')?.errors && (categoryForm.get('category_eng')?.touched || categoryForm.get ('category_eng')?.dirty)}">
                    </div>
                </div>
                <div class="col-md-3 mb-3" *ngIf="settings.category_roman">
                    <div class="form-group">
                        <label class="form-label">Category Name (Roman)</label>
                        <input type="text" class="form-control" placeholder="Category Name (Roman)"
                            formControlName="category_roman"
                            [ngClass]="{'validation':categoryForm.get('category_roman')?.errors && (categoryForm.get('category_roman')?.touched || categoryForm.get ('category_roman')?.dirty)}">
                    </div>
                </div>
                <div class="col-md-3 mb-3">
                    <div class="form-group">
                        <label class="form-label">Parent Category</label>
                        <select class="form-select" formControlName="parent_id">
                            <option [ngValue]="null">None (Root Category)</option>
                            <option *ngFor="let cat of categories" [ngValue]="cat._id">
                                {{ '\u00A0'.repeat(cat.level * 4) }}{{cat.category_hin}} <span *ngIf="cat.category_eng && cat.level === 0">({{cat.category_eng}})</span>
                            </option>
                        </select>

                    </div>
                </div>
                <div class="col-md-3 mb-3">
                    <div class="form-group">
                        <label class="form-label">Sort Order</label>
                        <input type="number" class="form-control" placeholder="0" formControlName="sort_order">
                    </div>
                </div>

                <div class="col-md-3 mb-3">
                    <button class="btn btn-primary submit mx-3" *ngIf="!isEdit" type="submit"
                        (click)="categoryFormSubmit()">Submit</button>
                    <button class="btn btn-warning submit mx-3" *ngIf="isEdit" type="submit"
                        (click)="categoryFormUpdate()">Update</button>
                    <!-- <button class="btn btn-light submit mx-3" type="button" (click)="categoryForm.reset()">Clear</button> -->
                </div>
            </div>
        </form>
    </div>
</div>
